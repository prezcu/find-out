spring.application.name=app-backend
# Server Port
server.port=8080

# Supabase PostgreSQL Configuration
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=spring_user.${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
# Time to wait for a free pooled connection before failing (pool-acquire, not query time).
spring.datasource.hikari.connection-timeout=30000
# Supabase/pgbouncer drops idle server connections; recycle ours before that happens so a
# "stale connection" error doesn't look like a slow query.
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
# JDBC socket read timeout (seconds, per the Postgres driver). 0 = infinite by default; set
# generous and ABOVE the 30s client cap so a genuinely stuck query is still eventually bounded,
# but valid slow queries always finish first. Hikari passes this through to the driver.
spring.datasource.hikari.data-source-properties.socketTimeout=45

# Explicitly tell Hibernate to use PostgreSQL to bypass the metadata check
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema is managed manually: the app's DB role (spring_user) has only DML privileges, not DDL.
# 'validate' makes Hibernate verify the entities match the live schema at startup and fail fast if
# a required table/column is missing -- it never issues CREATE/ALTER. Apply db/location_photos.sql
# with a privileged role BEFORE starting the app. (Switch to 'none' to skip the startup check.)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# JWT signing secret. MUST be at least 32 bytes. Override in production via env var:
#   export JWT_SECRET="<long random string>"
# The default below is a dev-only placeholder; do not ship it.
security.jwt.secret=${JWT_SECRET:dev-only-change-me-please-change-me-32b!!}
security.jwt.ttl-seconds=3600

# Google Places API (New). Unset -> photo features are disabled (no photos served, app still runs).
#   export GOOGLE_PLACES_API_KEY="<key with Places API (New) enabled>"
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.max-photos=8
google.places.photo-max-width-px=800